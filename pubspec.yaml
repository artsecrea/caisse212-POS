name: caisse212
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.3.2+11
environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  timeago: ^3.7.0
  loggecrea:
    path: packages/loggecrea
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  data_table_2: ^2.7.1
  flutter_onscreen_keyboard: ^0.4.1+1
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # Database
  drift: ^2.20.3
  # Direct: the remote console opens its own read-only connection.
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.2
  path: ^1.9.0

  # Network
  dio: ^5.4.1
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  audioplayers: ^6.5.1

  connectivity_plus: ^6.1.4
  bcrypt: ^1.2.0

  # UI Components
  getwidget: ^4.0.0
  flutter_svg: ^2.0.10+1
  flutter_form_builder: ^10.0.1
  form_builder_validators: ^11.2.0
  cached_network_image: ^3.3.1

  # Utilities
  shared_preferences: ^2.2.2
  # Pointed at the machine-wide folder at boot (services/shared_storage.dart).
  path_provider_platform_interface: ^2.1.2
  path_provider_windows: ^2.3.0
  path_provider_linux: ^2.2.1
  shared_preferences_platform_interface: ^2.4.1
  shared_preferences_windows: ^2.4.1
  shared_preferences_linux: ^2.4.1
  json_annotation: ^4.8.1
  uuid: ^4.5.2

  # Printing
  flutter_thermal_printer: ^2.0.0
  esc_pos_utils_plus: ^2.0.4
  image: ^4.7.2

  # Barcode Scanner
  flutter_barcode_listener: ^0.1.4

  # Update Service
  desktop_updater: ^1.4.0
  package_info_plus: ^8.0.0
  window_manager: ^0.4.3
  open_filex: ^4.5.0
  permission_handler: ^11.3.0
  crypto: ^3.0.3
  cryptography_plus: ^2.7.1
  archive: ^4.0.9
  http: ^1.2.0
  bonsoir: ^5.0.0
  file_picker: ^10.3.10
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.5.4

  drift_dev: ^2.20.3
  riverpod_generator: ^2.3.11
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/sounds/button_tap.mp3
    - assets/sounds/new_order.wav
    - assets/images/logo.svg
    - assets/images/caisse212.svg
    - assets/images/caisse212_icon.svg
    - assets/images/caisse212_icon.png
    - assets/images/logo-white.svg
    # Delivery-platform marks, shown on external orders.
    - assets/images/glovo.png
    - assets/images/kooul.png
    - assets/images/dealup.png
    # Pre-built KDS web app, served by the LAN server at /kds (see ServerService).
    - assets/kds_web.zip
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Flutter Launcher Icons Configuration
flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: "assets/images/caisse212_icon.png"
  image_path: "assets/images/caisse212_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/caisse212_icon.png"
  remove_alpha_ios: true
# Flutter Native Splash Configuration

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/app_logo.png
  android: true
  ios: true
  web: false
