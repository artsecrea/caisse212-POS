name: loggecrea
description: A powerful, flexible, and production-ready logging package in plain Dart (no Flutter dependency, so tools and servers can use it too). Features singleton pattern, custom handlers, before/after actions, and environment-aware configuration.
version: 0.0.1
repository: https://github.com/yourusername/loggecrea

environment:
  sdk: ^3.9.2

dev_dependencies:
  test: ^1.25.7
  lints: ^5.1.1
